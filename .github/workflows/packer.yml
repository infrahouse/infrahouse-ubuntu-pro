---
name: 'Packer AMI build'

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 */6 * * *"   # runs at :00 every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if base AMI unchanged'
        type: boolean
        default: false
      retention_dry_run:
        description: 'Report what AMI retention would remove, without removing it'
        type: boolean
        default: false

concurrency:
  group: schedule-6h
  cancel-in-progress: false

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read
  pull-requests: write

env:
  AWS_REGION: "us-west-1"
  ROLE_ARN: "arn:aws:iam::303467602807:role/ih-tf-infrahouse-ubuntu-pro-github"
jobs:
  build:
    name: 'Build AMI'
    # Packer builds into the VPC in 303467602807 and reaches the source instance
    # over SSH, so the job has to land on a runner in that account. Without the
    # environment label the org's production runners in 493370826424 match too,
    # and the build dies waiting for SSH before any provisioner runs.
    runs-on: ["self-hosted", "Linux", "noble", "environment:development"]

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        ubuntu_codename: ["noble"]

    env:
      UBUNTU_CODENAME: ${{ matrix.ubuntu_codename }}
      FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
      RETENTION_DRY_RUN: ${{ github.event.inputs.retention_dry_run || 'false' }}

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN}}
          role-session-name: packer-build
          aws-region: ${{ env.AWS_REGION }}

      # Before the build, not after. Retention frees public-AMI quota slots, and
      # the slot this build needs has to exist by the time packer publishes --
      # pruning afterwards would tidy up for a build that had already failed
      # with ResourceLimitExceeded. Runs on every scheduled invocation, including
      # the ones that decide not to rebuild, so expiry follows the clock rather
      # than the build cadence.
      # continue-on-error, with the gate at the end of the job: a retention
      # failure must not stop an AMI shipping. Run 33904005088 proved the point
      # -- one untaggable snapshot in us-east-1 failed the step, packer never
      # ran, and a build carrying Ubuntu security updates was held back by a
      # housekeeping permission. The job still goes red; it just goes red after
      # publishing rather than instead of it.
      - name: Apply AMI retention
        id: retention
        continue-on-error: true
        run: python ami_retention.py

      - name: Packer init
        run: packer init .

      - name: Packer build
        run: |
          python packer-build.py

      # Deliberately last. Retention ran first so its freed quota slots were
      # available to the build above; this reports its outcome without having
      # blocked it.
      - name: Fail if AMI retention did not complete
        if: steps.retention.outcome == 'failure'
        run: |
          echo "::error::AMI retention failed; see the 'Apply AMI retention' step above."
          exit 1
