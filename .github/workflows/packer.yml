---
name: 'Packer AMI build'

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 */6 * * *"   # runs at :00 every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if base AMI unchanged'
        type: boolean
        default: false

concurrency:
  group: schedule-6h
  cancel-in-progress: false

permissions:
  id-token: write  # This is required for requesting the JWT
  contents: read
  pull-requests: write

env:
  AWS_REGION: "us-west-1"
  ROLE_ARN: "arn:aws:iam::303467602807:role/ih-tf-infrahouse-ubuntu-pro-github"
jobs:
  build:
    name: 'Build AMI'
    # Packer builds into the VPC in 303467602807 and reaches the source instance
    # over SSH, so the job has to land on a runner in that account. Without the
    # environment label the org's production runners in 493370826424 match too,
    # and the build dies waiting for SSH before any provisioner runs.
    runs-on: ["self-hosted", "Linux", "noble", "environment:development"]

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        ubuntu_codename: ["noble"]

    env:
      UBUNTU_CODENAME: ${{ matrix.ubuntu_codename }}
      FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN}}
          role-session-name: packer-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Packer init
        run: packer init .

      - name: Packer build
        run: |
          python packer-build.py
